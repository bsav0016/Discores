name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install
        working-directory: app
        run: npm ci

      - name: Type check
        working-directory: app
        run: npx tsc --noEmit

      - name: Tests
        working-directory: app
        run: npx jest --ci

      # The legal text bundled into the app and the public web pages are generated from docs/legal.
      # If this fails, run `node app/scripts/build-legal.mjs` and `node app/scripts/build-site.mjs` and commit.
      - name: Legal documents and web pages are up to date
        run: |
          node app/scripts/build-legal.mjs
          node app/scripts/build-site.mjs
          git diff --exit-code -- app/src/lib/legal.generated.ts site
