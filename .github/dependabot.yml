version: 2

# Low-noise on purpose: one pull request per ecosystem per week, no major-version bumps, and nothing from the
# Expo / React Native family, whose versions must move together per Expo SDK (a lone bump already broke jest-expo once).
# Move those with `npx expo install --fix` when upgrading the SDK.
updates:
  - package-ecosystem: npm
    directory: /app
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    cooldown:
      default-days: 7 # skip versions published in the last week; lets a bad release get pulled first
    commit-message:
      prefix: 'chore(deps)'
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
      - dependency-name: 'expo'
      - dependency-name: 'expo-*'
      - dependency-name: '@expo/*'
      - dependency-name: 'jest-expo'
      - dependency-name: 'react'
      - dependency-name: 'react-dom'
      - dependency-name: '@types/react'
      - dependency-name: 'react-native'
      - dependency-name: 'react-native-*'
      - dependency-name: '@react-native-community/*'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 2
    cooldown:
      default-days: 7
    commit-message:
      prefix: 'ci'
    groups:
      github-actions:
        patterns: ['*']
